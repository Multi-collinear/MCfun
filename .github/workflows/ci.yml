name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Test
        run: |
          cd ${{ github.workspace }}
          pip install pytest "pyscf>=2.1" .
          pytest -s tests
